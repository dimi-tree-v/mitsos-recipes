[project]
name = "backend"
version = "0.1.0"
description = "Platform to explore an eclectic collection of culinary explorations!"
authors = [
    {name = "Dimitrios Vassilas",email = "dmailvass96@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django==5.2.8",
    "black==25.11.0",
]

[tool.poetry]
packages = [{include = "backend", from = "src"}]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
